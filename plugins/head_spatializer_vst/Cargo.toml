[package]
name = "stereo_eblet_3d"
version = "1.0.0"
edition = "2021"
authors = ["MusicMixCode"]
description = "Stereo Eblet 3D - Binaural 3D Head Spatializer & Psychoacoustic VST3 / CLAP Plugin"

[lib]
name = "stereo_eblet_3d"
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs", "vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
serde = { version = "1", features = ["derive"] }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "579130ecb4f9f315ae52190af42f0ea46aeaa4a2", features = ["opengl"] }
wgpu = "24"
raw-window-handle = "0.5"
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6" }
pollster = "0.4"
crossbeam = "0.8"
bytemuck = { version = "1", features = ["derive"] }
keyboard-types = "0.6"
egui = "0.31"
egui-wgpu = "0.31"
rand = "0.8"
dirs = "5"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
